<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concept Representation Study</title>
<style>
:root{
  --def:#17693a;
  --bg:#f6f5f2; --surface:#ffffff; --surface-2:#efede8; --ink:#1d1d1b; --ink-2:#4f4d48; --ink-3:#85827b;
  --line:#dcd9d2; --line-strong:#c4c0b6; --edge:#9d998f; --accent:#1f5f8b; --accent-ink:#ffffff; --accent-soft:#e2edf5;
  --warn:#8a5200; --warn-soft:#fbf0dc;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#151513; --surface:#1e1e1b; --surface-2:#292925; --ink:#ecebe7; --ink-2:#bdbab2; --ink-3:#8c897f;
    --line:#3a3934; --line-strong:#4d4b45; --edge:#6c6a62; --accent:#80b5dc; --accent-ink:#0c1822; --accent-soft:#1c3040;
    --warn:#e6b46a; --warn-soft:#33281a; --def:#6fd096;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit}
.topbar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;gap:10px 12px;align-items:center;flex-wrap:wrap}
.brand{font-weight:650;letter-spacing:-.01em}
.meta{color:var(--ink-3);font-size:13px}
.meta.warn{color:var(--warn)}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:8px;font-size:14px;cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn-primary:hover{background:var(--accent);filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.dot:focus-visible,.toggle button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.toggle button{border:0;padding:6px 10px;background:transparent;color:var(--ink-2);cursor:pointer;font-size:13px}
.toggle button+button{border-left:1px solid var(--line)}
.toggle button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink);font-weight:650}
.progress{height:3px;background:var(--surface-2)}
.progress>div{height:100%;width:0;background:var(--accent);transition:width .2s}
main{max-width:1100px;margin:0 auto;padding:20px 16px 56px}
.banner{background:var(--warn-soft);color:var(--warn);border:1px solid currentColor;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;margin-bottom:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.card-label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:650;margin-bottom:10px}
.eyebrow{font-size:13px;color:var(--ink-3);margin-bottom:2px}
h1.concept{font-size:22px;line-height:1.3;margin:0 0 14px;font-weight:650;letter-spacing:-.01em}
h1.concept .sctid{font-size:14px;margin-left:6px}

/* ---- tree view ---- */
.ctx{display:flex;flex-direction:column;gap:3px}
.tok{display:flex;gap:4px 8px;align-items:baseline;flex-wrap:wrap}
.term{font-weight:520;overflow-wrap:anywhere}
.diff .term,.diff .g-term,.term.diff{font-weight:760;color:var(--ink)}
.uncovered.diff,.tokrow.unc.diff{font-weight:800;color:var(--ink)}
.diff-hint{font-size:13px;color:var(--ink-3);margin:12px 0 -4px}
.diff-hint b{color:var(--ink)}
.tag{color:var(--ink-3)}
.sctid{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.rblock+.rblock,.ctx>.tok+.rblock,.ctx>.sub+.rblock,.rblock+.sub{margin-top:6px}
.rel{font-size:13px;color:var(--accent);font-weight:650;margin-bottom:2px}
.rel.def{color:var(--def)}
.tok.def .term,.tok.def .tag{color:var(--def)}
.gnode .tokrow.def .g-term,.gnode .tokrow.diff.def .g-term{color:var(--def)}
.tok.diff.def .term{color:var(--def)}
.status{display:inline-block;font-size:11.5px;font-weight:650;letter-spacing:.03em;text-transform:none;border:1px solid var(--line-strong);border-radius:999px;padding:1px 8px;margin-left:8px;color:var(--ink-2)}
.prim-note{font-size:13px;color:var(--ink-2);margin:-4px 0 10px}
.def-legend{color:var(--def);font-weight:650}
.sub{margin-left:4px;padding-left:14px;border-left:2px solid var(--line)}
.uncovered{font-family:var(--mono);color:var(--ink-3);font-size:17px;line-height:1.2}
.group{border:1px dashed var(--line-strong);border-radius:8px;padding:6px 10px 8px;margin-top:8px}
.group-label{font-size:12px;color:var(--ink-3);margin-bottom:2px}

/* ---- graph view ---- */
.graph{overflow-x:auto;overflow-y:hidden;padding:2px 2px 6px}
.gcanvas{position:relative}
.gedges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.gedges path.edge{fill:none;stroke:var(--edge);stroke-width:1.4}
.gedges marker path{fill:var(--edge)}
.gedges text{fill:var(--accent);font:650 11.5px var(--sans)}
.gedges text.def{fill:var(--def)}
.gnode{position:absolute;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);padding:6px 9px;font-size:13.5px;line-height:1.3;overflow-wrap:anywhere}
.gnode .g-term{display:block;font-weight:520}
.gnode .g-sub{display:block;font-size:12px;color:var(--ink-3)}
.gnode .g-sub .sctid{font-size:11.5px}
.gnode .tokrow+.tokrow{border-top:1px solid var(--line);margin-top:5px;padding-top:5px}
.gnode .tokrow.unc{font-family:var(--mono);color:var(--ink-3);font-size:15px}
.gnode.concept{background:var(--surface-2);border-style:dashed}
.gnode.concept .g-term{font-weight:650}
.gnode.empty{text-align:center;font-family:var(--mono);color:var(--ink-3);border-style:dotted;padding:4px 0;font-size:16px}
.gnode.empty.diff{font-weight:800;color:var(--ink)}
.gnode .tokrow.diff .g-term{font-weight:760;color:var(--ink)}
.gnode .tokrow.unc.diff{font-weight:800;color:var(--ink)}
.gnode.group{border-radius:999px;padding:0;height:34px;display:grid;place-items:center;font-size:11px;font-weight:650;color:var(--ink-3)}

.def-foot{border-top:1px solid var(--line);margin-top:14px;padding-top:10px}
/* versions */
.versions{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.versions.stack{grid-template-columns:1fr}
@media (max-width:760px){.versions{grid-template-columns:1fr}}
.ver-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.badge{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--surface-2);font-weight:700;font-size:15px}
.ver-title{font-weight:650}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0;font-size:13px;font-weight:650;color:var(--ink-2);margin-bottom:4px}
.issues{border-top:1px solid var(--line);margin-top:14px;padding-top:10px}
.versions.stack .checks{display:flex;flex-wrap:wrap;gap:0 26px}
.check{display:flex;gap:9px;align-items:flex-start;padding:4px 0;cursor:pointer}
.check input{width:16px;height:16px;margin:3px 0 0;accent-color:var(--accent);flex:none}
/* main question */
.question{margin-top:16px}
.question legend{font-size:16px;color:var(--ink);margin-bottom:10px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:520px){.seg{grid-template-columns:1fr}}
.seg label{position:relative;border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center;cursor:pointer;background:var(--surface);font-weight:550}
.seg label:hover{background:var(--surface-2)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.comment{margin-top:16px}
.comment label{display:block;font-size:13px;font-weight:650;color:var(--ink-2);margin-bottom:6px}
textarea,input[type=text]{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--ink);font:inherit}
textarea{min-height:72px;resize:vertical}
textarea:focus,input[type=text]:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
/* nav */
.navbar{display:flex;align-items:center;gap:12px;margin-top:20px}
.dots{display:flex;flex-wrap:wrap;gap:6px;flex:1;justify-content:center}
.dot{min-width:32px;height:32px;padding:0 6px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:12px;cursor:pointer;color:var(--ink-2)}
.dot.done{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.dot.cur{box-shadow:0 0 0 2px var(--ink)}
.done-box{margin-top:20px;border-color:var(--accent)}
.done-box h2{margin:0 0 4px;font-size:17px}
.done-box p{margin:0 0 12px;color:var(--ink-2)}
/* intro */
.intro{max-width:760px}
.intro h2{margin:0 0 10px;font-size:20px}
.intro h3{margin:18px 0 6px;font-size:15px}
.intro p,.intro li{color:var(--ink-2)}
.intro ol,.intro ul{padding-left:20px}
.intro dl{margin:0}
.intro dt{font-weight:650;margin-top:8px}
.intro dd{margin:0;color:var(--ink-2)}
.intro .row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-top:18px}
.intro .row label{font-size:13px;font-weight:650;color:var(--ink-2);display:block;margin-bottom:4px}
.hidden{display:none !important}
</style>
</head>
<body>

  <div class="topbar-inner">

</header>
<main id="main"></main>

/* ---------- storage ---------- */
const KEY = 'semeval:' + DATA.study_id + ':' + (DATA.rater_id || '');
let storageOK = true;
let lastSaved = '';
function load() {
  try { const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; }
  catch (e) { storageOK = false; return null; }
}
function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); storageOK = true; lastSaved = clock(new Date()); }
  catch (e) { storageOK = false; }
  renderMeta();
}

  { rater_id: DATA.rater_id || '', lang: DATA.lang || 'en', view: DATA.view_default || 'graph',
    introSeen: false, current: 0, answers: {}, lastExport: '' },

  const name = 'answers_' + safe(DATA.study_id) + '_' + safe(state.rater_id || 'rater') + '_' + stamp + '.csv';
  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  const link = h('a', { href: url, download: name });
  document.body.append(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  state.lastExport = clock(now);
  persist();
}

/* ---------- wiring ---------- */
$('b-download').addEventListener('click', download);
$('b-instr').addEventListener('click', () => {
  if (showIntro) { showIntro = false; render(); startTimer(); }
  else { stopTimer(); persist(); showIntro = true; render(); }
  window.scrollTo(0, 0);
});
document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => {
  state.lang = b.dataset.lang; persist();
  const y = window.scrollY; render(); window.scrollTo(0, y);
}));
document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => {
  if (state.view === b.dataset.view) return;
  state.view = b.dataset.view; persist();
  const y = window.scrollY; render(); window.scrollTo(0, y);
}));

render();
startTimer();
})();
</script>
</body>
</html>
